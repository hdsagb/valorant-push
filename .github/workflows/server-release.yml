name: server-release

# 打 server-v* 标签发布 Docker 镜像到 GHCR；也可手动触发跑测试
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

# 默认只读；只有发布 job 才提升为可写
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0，与 release.yml 相同
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0，与 release.yml 相同
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest server/tests -v

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0，与 release.yml 相同
      - name: 计算版本号
        run: echo "VERSION=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/valorant-push-server:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/valorant-push-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "服务器版 $GITHUB_REF_NAME" \
            --generate-notes
