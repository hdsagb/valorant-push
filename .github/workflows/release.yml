name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 默认只读；只有发布 job 才提升为可写
permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==${{ env.PYINSTALLER_VERSION }}

      - name: 构建 exe
        run: pyinstaller --noconfirm ValorantPushPersonal.spec

      - name: 打包压缩
        shell: pwsh
        run: |
          # LGPL-3.0 / Apache-2.0 等许可要求随分发附带许可证与第三方声明
          Compress-Archive -Path dist/ValorantPushPersonal.exe, LICENSE, THIRD_PARTY_LICENSES.md `
            -DestinationPath ValorantPushPersonal-windows-x64.zip -Force
          $hash = (Get-FileHash ValorantPushPersonal-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ValorantPushPersonal-windows-x64.zip" | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ValorantPushPersonal-windows-x64
          path: |
            ValorantPushPersonal-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ValorantPushPersonal-windows-x64

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME ValorantPushPersonal-windows-x64.zip SHA256SUMS.txt `
            --title "无畏契约商店推送 $env:GITHUB_REF_NAME" --generate-notes
